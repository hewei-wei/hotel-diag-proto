<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>酒店新媒体营销平台 · PC端交互原型</title>
<style>
  :root{
    /* 颜色令牌 */
    --ink:#111827;--ink-2:#4b5563;--ink-3:#6b7280;--ink-4:#9ca3af;
    --line:#e5e7eb;--line-soft:#f3f4f6;
    --bg:#f6f7f9;--surface:#fff;--surface-2:#f9fafb;
    --primary:#4f46e5;--primary-hover:#4338ca;--primary-soft:#eef2ff;--primary-line:#e0e7ff;
    --ok:#065f46;--ok-bg:#ecfdf5;--ok-line:#d1fae5;
    --warn:#92400e;--warn-bg:#fffbeb;--warn-line:#fde68a;
    /* 间距令牌 */
    --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;--s8:32px;
    /* 圆角 / 阴影 */
    --r-sm:8px;--r-md:10px;--r-lg:14px;
    --shadow-sm:0 1px 2px rgba(17,24,39,.05);
    --shadow-md:0 4px 12px rgba(17,24,39,.08);
    --shadow-lg:0 24px 48px rgba(17,24,39,.18);
  }
  *{box-sizing:border-box}
  body{margin:0;min-width:1240px;background:var(--bg);color:var(--ink);font-size:13px;line-height:1.6;
    font-family:-apple-system,"Segoe UI","Microsoft YaHei","PingFang SC",Arial,sans-serif}
  button,input,select{font:inherit;color:inherit}
  button{cursor:pointer;background:none;border:0;padding:0}
  .hidden{display:none!important}

  /* ===== 左侧导航 ===== */
  .sidebar{position:fixed;top:0;left:0;bottom:0;width:232px;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 14px;z-index:10}
  .brand{display:flex;align-items:center;gap:10px;padding:0 8px 20px}
  .brand-mark{flex:none;width:34px;height:34px;border-radius:var(--r-sm);background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px}
  .brand b{font-size:14.5px;letter-spacing:.3px;display:block;line-height:1.3}
  .brand small{display:block;font-size:11px;color:var(--ink-3);line-height:1.3}
  .nav{flex:1;display:flex;flex-direction:column;gap:2px}
  .nav button{display:flex;align-items:center;gap:10px;height:40px;padding:0 12px;border-radius:var(--r-sm);font-size:13.5px;color:var(--ink-2);text-align:left}
  .nav button i{flex:none;width:18px;text-align:center;font-style:normal;font-size:14px;color:var(--ink-4)}
  .nav button:hover{background:var(--surface-2);color:var(--ink)}
  .nav button.active{background:var(--primary-soft);color:var(--primary);font-weight:600}
  .nav button.active i{color:var(--primary)}
  .nav button em{margin-left:auto;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:#f43f5e;color:#fff;font-size:11px;font-style:normal;display:grid;place-items:center}
  .nav p{margin:18px 12px 6px;font-size:11.5px;color:var(--ink-4);font-weight:600}

  /* ===== 主区域 ===== */
  .main-wrap{margin-left:232px;min-height:100vh}
  .topbar{position:sticky;top:0;z-index:20;height:60px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 32px}
  .topbar>div:first-child{display:flex;align-items:center;gap:10px}
  .topbar b{font-size:15px}
  .topbar small{font-size:12px;color:var(--ink-4)}
  .account{display:flex;align-items:center;gap:10px;padding:4px 6px 4px 4px;border-radius:999px}
  .account:hover{background:var(--surface-2)}
  .avatar{width:30px;height:30px;border-radius:50%;background:var(--primary-soft);color:var(--primary);font-weight:700;font-size:12px;display:grid;place-items:center}
  .account-meta{display:flex;flex-direction:column;line-height:1.25}
  .account-meta b{font-size:13px}
  .account-meta small{font-size:11px;color:var(--ink-3)}
  .account>span:last-child{color:var(--ink-4);font-size:11px}
  .perm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
  .perm-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:#fff}
  .perm-row small{display:block;color:var(--ink-4);font-size:11px;font-weight:400}
  .perm-row input{flex:1;min-width:0;height:28px;border:1px solid var(--primary);border-radius:6px;padding:0 8px;font-size:13px}
  .perm-row input[type=checkbox]{flex:none;width:15px;height:15px;padding:0;border:none;border-radius:3px;accent-color:var(--primary);cursor:pointer}
  .rtree-kids{margin:6px 0 10px 18px;display:grid;gap:6px}
  .rtree-kids .perm-row span{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .perm-row input:focus{outline:none;box-shadow:0 0 0 3px var(--primary-soft)}
  .perm-row.off{background:var(--bg);color:var(--ink-4)}
  .sw{position:relative;width:34px;height:19px;border-radius:10px;background:var(--line);cursor:pointer;flex:none;transition:background .15s}
  .sw::after{content:'';position:absolute;left:2px;top:2px;width:15px;height:15px;border-radius:50%;background:#fff;transition:left .15s}
  .sw.on{background:var(--primary)}
  .sw.on::after{left:17px}
  .m-sub{font-size:12px;color:var(--ink-4);margin:0 0 14px}
  .m-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
  .m-sec{font-size:12px;font-weight:600;color:var(--ink-2);margin:14px 0 8px}

  /* ===== 内容区 ===== */
  .page{padding:var(--s6) 32px 48px}
  .page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--s4);margin-bottom:var(--s5)}
  .page-head h1{margin:0 0 4px;font-size:20px;font-weight:700}
  .page-head p{margin:0;color:var(--ink-3);font-size:13px}
  .page-head .tag{margin-top:6px}

  /* 提示条 */
  .notice{display:flex;gap:12px;align-items:flex-start;background:var(--primary-soft);border:1px solid var(--primary-line);border-radius:var(--r-md);padding:13px 16px;margin-bottom:var(--s5)}
  .notice-icon{flex:none;width:26px;height:26px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:13px;font-style:normal;margin-top:1px}
  .notice b{display:block;font-size:13.5px;color:var(--ink)}
  .notice span{display:block;font-size:12.5px;color:var(--ink-2);margin-top:2px}

  /* 面板：工具栏 + 表格 一体 */
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-sm);overflow:hidden}
  .panel-toolbar{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap;padding:14px 18px}
  .search{flex:none;display:flex;align-items:center;gap:8px;width:300px;height:36px;padding:0 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);color:var(--ink-4)}
  .search:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
  .search input{flex:1;border:0;outline:0;font-size:13px;color:var(--ink)}
  .seg{display:flex;gap:2px;background:var(--line-soft);border-radius:var(--r-md);padding:3px}
  .seg button{height:32px;padding:0 14px;border-radius:var(--r-sm);font-size:12.5px;color:var(--ink-3);display:flex;align-items:center;gap:7px}
  .seg button:hover{color:var(--ink)}
  .seg button.active{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow-sm)}
  .seg button i{font-style:normal;font-size:11px;color:var(--ink-4);background:var(--line-soft);border-radius:999px;padding:0 7px;line-height:17px}
  .seg button.active i{background:var(--primary-soft);color:var(--primary)}

  /* 酒店表格 */
  .grid-row{display:grid;grid-template-columns:minmax(150px,1.2fr) 90px .9fr .9fr .9fr 1.15fr 1fr;align-items:center;gap:12px;padding:0 18px}
  .table-head{height:44px;background:var(--surface-2);border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:12px;font-weight:600;color:var(--ink-3)}
  .hotel-row{min-height:64px;border-bottom:1px solid var(--line-soft);transition:background .15s}
  .hotel-row:last-child{border-bottom:0}
  .hotel-row:hover{background:#fafbfc}
  .hotel-name{font-size:14px;font-weight:600}
  .badge{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 11px;border-radius:999px;font-size:12px;font-weight:500}
  .badge i{width:6px;height:6px;border-radius:50%;font-style:normal}
  .badge.ok{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-line)}
  .badge.ok i{background:#10b981}
  .badge.off{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-line)}
  .badge.off i{background:#f59e0b}
  .badge.expired{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}
  .badge.expired i{background:#f43f5e}
  .time{font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink-2)}
  .time.empty{color:var(--ink-4)}
  .row-actions{display:flex;justify-content:flex-end;gap:8px}
  .btn{height:34px;padding:0 14px;border-radius:var(--r-sm);font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;transition:.15s}
  .btn-primary{background:var(--primary);color:#fff}
  .btn-primary:hover{background:var(--primary-hover)}
  .btn-outline{background:var(--surface);border:1px solid #d1d5db;color:var(--ink-2)}
  .btn-sm{height:28px;padding:0 11px;font-size:12px;border-radius:999px}
  .tgap{margin-left:8px}
  .btn-outline:hover{border-color:var(--primary);color:var(--primary)}
  .btn-ghost{color:var(--primary);padding:0 8px}
  .btn:disabled{background:var(--line-soft);color:var(--ink-4);cursor:not-allowed;box-shadow:none}
  .btn-lg{height:40px;padding:0 18px}
  .empty-state{padding:56px 0;text-align:center;color:var(--ink-3)}
  .empty-state i{display:grid;place-items:center;width:44px;height:44px;margin:0 auto 10px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);font-size:17px;font-style:normal;color:var(--ink-4)}

  /* 系统管理：查询区 + 数据列表 + 分页（对齐 Ant Design Pro 表格样式） */
  .qbar{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;padding:14px 18px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--shadow-sm);margin-bottom:14px}
  .qfield{display:flex;flex-direction:column;gap:5px}
  .qfield>label{font-size:12px;color:var(--ink-3)}
  .qfield input,.qfield select{height:34px;min-width:190px;border:1px solid #d1d5db;border-radius:var(--r-sm);padding:0 10px;font-size:13px;color:var(--ink);background:var(--surface)}
  .qfield input:focus,.qfield select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
  .tbl-cap{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 12px}
  .tbl-cap h3{margin:0;font-size:14px;font-weight:600}
  .tbl-cap small{font-size:12px;color:var(--ink-4);font-variant-numeric:tabular-nums}
  .ugrid{display:grid;grid-template-columns:1.1fr 1.1fr .75fr 1.1fr 1.1fr minmax(230px,1.5fr);align-items:center;gap:10px;padding:0 18px}
  .rgrid{display:grid;grid-template-columns:1.05fr .7fr 1.7fr 1.7fr minmax(120px,.9fr);align-items:center;gap:10px;padding:0 18px}
  .agrid{display:grid;grid-template-columns:1.1fr 1.15fr .62fr .62fr 1.7fr .95fr;align-items:center;gap:10px;padding:0 18px}
  .resgrid{display:grid;grid-template-columns:minmax(230px,2.1fr) .8fr 1.25fr 1.25fr .55fr minmax(130px,1fr);align-items:center;gap:10px;padding:0 18px}
  .srow{min-height:52px;border-bottom:1px solid var(--line-soft);transition:background .15s}
  .srow:hover{background:#fafbfc}
  .srow:last-child{border-bottom:0}
  .tree-tw{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;margin-right:8px;border:1px solid #d1d5db;border-radius:4px;font-size:10px;color:var(--ink-3);cursor:pointer;user-select:none;flex:none}
  .tree-tw:hover{border-color:var(--primary);color:var(--primary)}
  .typechip{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:6px;font-size:11.5px;font-weight:500}
  .typechip.tmenu{background:var(--primary-soft);color:var(--primary)}
  .typechip.tbtn{background:#ecfdf5;color:#059669}
  .typechip.tapi{background:#fef3c7;color:#b45309}
  .linkbtn{background:none;border:0;padding:0;height:auto;font-size:12.5px;color:var(--primary);cursor:pointer;font-weight:400}
  .linkbtn:hover{text-decoration:underline}
  .linkbtn.danger{color:#dc2626}
  .linkbtn.dim{color:var(--ink-4);cursor:default}
  .linkbtn.dim:hover{text-decoration:none}
  .tbl-foot{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-top:1px solid var(--line);background:var(--surface)}
  .tbl-foot small{font-size:12px;color:var(--ink-4);font-variant-numeric:tabular-nums}
  .pager{display:flex;gap:5px}
  .pager button{min-width:28px;height:28px;padding:0 7px;border:1px solid #d1d5db;border-radius:6px;font-size:12.5px;color:var(--ink-2);background:var(--surface)}
  .pager button.cur{background:var(--primary);border-color:var(--primary);color:#fff}
  .pager button:disabled{color:var(--ink-4);cursor:not-allowed;background:var(--surface)}

  /* 二级导航（右侧内容区顶部，进入酒店后展示） */
  .subnav{position:sticky;top:60px;z-index:15;display:flex;align-items:center;gap:16px;height:52px;padding:0 32px;background:var(--surface);border-bottom:1px solid var(--line)}
  .sub-back{flex:none;display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--ink-3);height:30px;padding:0 10px;border-radius:var(--r-sm)}
  .sub-back:hover{background:var(--surface-2);color:var(--primary)}
  .sub-hotel{flex:none;display:flex;align-items:baseline;gap:8px;padding-right:16px;border-right:1px solid var(--line-soft)}
  .sub-hotel b{font-size:14px}
  .sub-hotel small{font-size:12px;color:var(--ink-3)}
  .subnav nav{display:flex;gap:4px;height:100%}
  .subnav nav button{display:inline-flex;align-items:center;gap:6px;padding:0 14px;font-size:13px;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px}
  .subnav nav button:hover{color:var(--ink)}
  .subnav nav button.active{color:var(--primary);font-weight:600;border-color:var(--primary)}
  .subnav nav em{min-width:17px;height:17px;padding:0 5px;border-radius:999px;background:#f43f5e;color:#fff;font-size:10.5px;font-style:normal;display:grid;place-items:center}

  /* 卡片与统计 */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-sm);padding:20px 22px}
  .card h3{margin:0 0 6px;font-size:15px}
  .card>p{margin:0 0 var(--s4);color:var(--ink-3);font-size:13px}

  /* 账号管理 */
  .narrow{max-width:560px}
  .profile{display:flex;align-items:center;gap:14px;padding:4px 0 18px;border-bottom:1px solid var(--line-soft)}
  .profile .avatar{width:48px;height:48px;font-size:17px}
  .profile b{font-size:15px;display:block}
  .profile small{display:block;font-size:12.5px;color:var(--ink-3)}
  .profile .badge{margin-left:auto}
  .info-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line-soft);font-size:13px}
  .info-row:last-child{border-bottom:0}
  .info-row small{color:var(--ink-3)}
  .info-row b{font-size:13.5px;font-weight:600}

  /* 页签 */
  .tabs{display:flex;gap:24px;border-bottom:1px solid var(--line);margin-bottom:var(--s4)}
  .tabs button{padding:11px 2px;font-size:13.5px;color:var(--ink-3)}
  .tabs button.active{color:var(--primary);border-bottom:2px solid var(--primary);font-weight:600;margin-bottom:-1px}

  /* 通用表格（任务等） */
  .tgrid{display:grid;grid-template-columns:2fr 1fr 1fr .8fr .9fr .8fr;align-items:center;gap:12px;padding:0 18px}
  .thead{height:44px;background:var(--surface-2);border-bottom:1px solid var(--line);font-size:12px;font-weight:600;color:var(--ink-3)}
  .trow{min-height:60px;border-bottom:1px solid var(--line-soft);font-size:13px}
  .trow:hover{background:#fafbfc}
  .trow:last-child{border-bottom:0}
  .tcell-title{display:flex;flex-direction:column}
  .tcell-title b{font-size:13.5px}
  .tcell-title small{font-size:12px;color:var(--ink-4);margin-top:2px}
  .tag{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:6px;font-size:12px;font-style:normal;width:max-content}
  .tag.red{background:#fef2f2;color:#b91c1c}
  .tag.gray{background:var(--line-soft);color:var(--ink-2)}
  .tag.green{background:var(--ok-bg);color:var(--ok)}
  .tag.blue{background:#eff6ff;color:#2563eb}
  /* 抖音来客「信用卡 & 第三方支付」多选下拉（全选＋复选列表，与商家后台一致） */
  .gb-ms{display:inline-block;position:relative;min-width:240px;max-width:520px;min-height:32px;padding:4px 26px 4px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;line-height:1.5;vertical-align:middle}
  .gb-ms::after{content:'▾';position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--ink-4);font-size:12px}
  .gb-ms.open{border-color:var(--primary)}
  .gb-ms i{font-style:normal;color:var(--ink-4)}
  .gb-mspop{display:block;flex-basis:100%;max-width:560px;max-height:200px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;background:#fff;padding:8px 12px}
  .gb-mspop .gb-radio{margin:3px 0}
  .ro .gb-ms,.ro .gb-mspop{pointer-events:none}
  .gb-hol-it>span{color:var(--ink-4);font-size:11px}

  /* 返回 / 详情 */
  .back{color:var(--ink-3);font-size:13px;margin-bottom:var(--s3);display:inline-flex;align-items:center;gap:6px}
  .back:hover{color:var(--primary)}
  .detail-grid{display:grid;grid-template-columns:1fr 300px;gap:var(--s4);align-items:start}
  .section{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-sm);padding:20px 22px;margin-bottom:var(--s4)}
  .section h3{margin:0 0 var(--s4);font-size:14.5px}
  .source{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s3);background:var(--surface-2);border-radius:var(--r-md);padding:16px}
  .source small{font-size:12px;color:var(--ink-3)}
  .source b{display:block;font-size:13.5px;margin-top:5px}
  .fields{display:grid;grid-template-columns:1fr 1fr;gap:var(--s4)}
  .field{display:flex;flex-direction:column;gap:7px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
  .field select{height:40px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);padding:0 10px;font-weight:400}
  .field select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
  .field input{height:40px;border:1px solid var(--primary-line);border-radius:var(--r-sm);background:var(--primary-soft);padding:0 10px;font-weight:600;color:var(--primary)}
  .field input:focus{outline:none;border-color:var(--primary);background:var(--surface);color:var(--ink);box-shadow:0 0 0 3px var(--primary-soft)}
  .field small{font-weight:400;color:var(--ink-4);font-size:11.5px}
  .action-bar{display:flex;justify-content:flex-end;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-sm);padding:14px 18px}
  .side-card li{font-size:12.5px;color:var(--ink-2);line-height:2.1}

  /* 找店指引任务详情 */
  .guide-choose .guide-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .guide-row b{font-size:13.5px}
  .guide-card{display:flex;align-items:center;gap:12px;width:100%;padding:16px 18px;border:1px solid var(--primary-line);border-radius:var(--r-md);background:linear-gradient(135deg,var(--primary-soft),#fbfcfe);cursor:pointer;text-align:left;margin-bottom:10px;transition:box-shadow .15s}
  .guide-card:hover{box-shadow:var(--shadow-md)}
  .guide-card .g-name{font-weight:600;font-size:14.5px}
  .guide-card .tag{margin-left:auto}
  .guide-card>b{color:var(--ink-4);font-size:18px;line-height:1}
  .exlink{color:var(--primary);font-size:12px;cursor:pointer;flex:none}

  /* 房型信息核对：逐字段「由 → 修改为」差异表 */

  /* 列表 */
  .list-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-sm);overflow:hidden}

  .lrow .lt b{font-size:13.5px}

  .diag-hero{border-left:4px solid var(--primary);padding:24px 28px 26px}

  .stb-pass{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-line)}

  .stb-cf{background:#b45309;color:#fff}

  .dlist{position:relative}

  .drow.focus{background:var(--primary-soft)}

  /* 处理详情只读态：数据快照纯展示，控件不可编辑 */
  .ro input,.ro select,.ro textarea{pointer-events:none;background:var(--surface-2);color:var(--ink-2)}

  /* 弹窗 */
  .modal-mask{position:fixed;inset:0;background:rgba(17,24,39,.45);backdrop-filter:blur(2px);display:grid;place-items:center;z-index:30}

  .modal h2{margin:0 0 4px;font-size:17px}

  .steps{display:grid;grid-template-columns:1fr 24px 1fr;align-items:center;gap:4px;margin:20px 0 18px}

  .auth-field input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
  .code{display:grid;grid-template-columns:1fr 112px;gap:8px}

  .modal-foot{margin-top:16px;padding-top:13px;border-top:1px solid var(--line-soft);font-size:12px;color:var(--ink-3);line-height:1.7}
  .reauth{width:100%;margin-top:12px}

  /* 轻提示 */
  .toast{position:fixed;right:24px;top:76px;background:var(--ink);color:#fff;padding:12px 18px;border-radius:var(--r-md);box-shadow:var(--shadow-lg);z-index:40;font-size:13px;display:flex;align-items:center;gap:8px}
  .toast i{width:18px;height:18px;border-radius:50%;background:#10b981;display:grid;place-items:center;font-size:11px;font-style:normal}
</style>

  /* ===== 诊断工作台（二级页面） ===== */

        </div>
      </div>
      <div class="hero-progress"><div class="pbar"><i style="width:${pct}%"></i></div><b class="hero-pct">${pct}%</b></div>
      <div class="hero-stats">
        <div class="hstat clickable" onclick="openStat('all')"><small>检查数</small><b>${total}</b></div>

        <div class="hstat clickable" onclick="openStat('fail')"><small>不通过数</small><b style="color:#b91c1c">${failed}</b></div>

          <div class="dlist">
            ${diagSteps.map((s,i)=>{const st=diagRun.steps[i],n=s.items.length,fl=stepFails(i),nc=st.items.filter(x=>isCfail(x.state)).length,add=diagRun.added.filter(t=>t.path.startsWith(s.name+' ·')).length;

          ${(()=>{const stasks=taskData.filter(t=>t.status==='待处理'&&t.path.startsWith(step.name+' · '));

            ${stasks.map(t=>`<div class="st-row"><div class="st-info"><b>${t.name}</b><small>${t.path.split(' · ')[1]||''}</small></div></div>`).join('')}</div>`:''})()}
        </div>
      </aside>
    </div>
  </div>`}

  /* ===== 诊断任务 ===== */
  let taskData=[];
  let taskTab='todo',taskIdx=0,taskQuery='',taskExec='全部';
  const todoTasks=()=>taskData.filter(t=>t.status==='待处理'),doneTasks=()=>taskData.filter(t=>t.status==='已处理');
  const execTag=e=>e==='执行成功'?'green':e==='执行失败'?'red':e==='已忽略'?'gray':'';

  function setTaskTab(t){taskTab=t;roTask=null;render()}

  function openTask(i){taskIdx=taskData.indexOf(todoTasks()[i]);taskTab='todo';roTask=null;guideMode=null;guideVia=1;replySel={};replyText={};gbSel={};gbPriv={};auAct={};facPick={};calTo=null;polF=polDef();polMs={open:null};xspPick=0;smkPick=1;paySel={};payOpen=null;hotSel={};picUpl=false;go('detail')}
  function finishTask(exec,msg){const t=taskData[taskIdx];t.status='已处理';t.submitTime='2026-08-28 12:30:00';t.exec=exec;toast(msg);taskTab='done';roTask=null;taskQuery='';taskExec='全部';guideMode=null;replySel={};replyText={};gbSel={};gbPriv={};auAct={};facPick={};calTo=null;polF=polDef();polMs={open:null};xspPick=0;smkPick=1;paySel={};payOpen=null;hotSel={};picUpl=false;go('tasks')}
  /* 二次确认弹窗：此次忽略 */
  let confirmAsk=null;
  function askIgnore(i,type){const t0=taskData[i];confirmAsk={i,type};const t=t0;
    const c=type==='skip'
      ?{title:'确认此次忽略？',body:`忽略后本次任务关闭，下次诊断仍会检查「${t.path}」节点。`,btn:'确认忽略'}
      :null;
    $('#modalRoot').innerHTML=`<div class="modal-mask" onclick="closeConfirm(event)"><div class="modal" onclick="event.stopPropagation()" style="width:400px">
      <h2>${c.title}</h2><p class="sub">${c.body}</p>
      <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:18px"><button class="btn btn-outline" onclick="closeConfirm()">取消</button><button class="btn btn-primary" onclick="doIgnore()">${c.btn}</button></div>
    </div></div>`}
  function closeConfirm(e){if(e&&e.target!==e.currentTarget)return;confirmAsk=null;$('#modalRoot').innerHTML=''}
  function doIgnore(){const a=confirmAsk;closeConfirm();const t=taskData[a.i];t.status='已处理';t.submitTime='2026-08-28 12:30:00';t.exec='已忽略';
    toast('已忽略本次任务，下次诊断仍会检查');
    taskTab='done';roTask=null;taskQuery='';taskExec='全部';guideMode=null;replySel={};replyText={};gbSel={};gbPriv={};auAct={};facPick={};calTo=null;polF=polDef();polMs={open:null};xspPick=0;smkPick=1;paySel={};payOpen=null;hotSel={};picUpl=false;go('tasks')}
  function tasks(){
    const todo=todoTasks(),done=doneTasks();
    const execOpts=['全部','执行中','执行成功','执行失败','已忽略'];
    return `<div class="page">
    <div class="page-head"><div><h1>诊断任务</h1><p>本次诊断生成的任务，逐项确认后 AI 才会进入抖音来客执行修改</p></div></div>

        </div>`:''}`}).join('')}
      </div>`:(done.length===0?'<div class="empty-state"><i>✓</i>暂无已处理诊断，提交或忽略任务后该次诊断会展示在这里</div>':'<div class="empty-state"><i>⌕</i>未找到匹配的任务，请调整搜索内容或筛选条件</div>')})()}`}

  /* 日历房早餐份数：仅展示本任务不通过的房型，通过房型不在任务内展示、也不生成任务（与《抖音来客诊断规则表A》「日历房房型与早餐份数」一致） */
  const calTask=(advice,room)=>({advice,ignore:'此次忽略',cal:{room}});

  function resTree(){
    const groups=['酒店管理','诊断工作台','诊断任务'];

      const bs=permButtons.filter(b=>b.group===groups[k]).map((b,bi)=>({type:'btn',name:b.name,code:'btn:'+b.key,path:'—',sort:bi+1,on:b.on===1,bind:{t:'btn',k:b.key}}));
      const apis=MENU_META[k].api().map((a,ai)=>({type:'api',name:a.name,code:a.code,path:a.path,sort:100+ai,on:a.on===1,apiRef:a}));
      return {id:'m'+k,type:'menu',name:m.name,code:MENU_META[k].code,path:MENU_META[k].path,comp:MENU_META[k].comp,desc:MENU_META[k].desc,sort:k+1,on:m.on===1,bind:{t:'menu',k},kids:withCustom('m'+k,bs.concat(apis))};

    return menus;

    <div class="page-head"><div><h1>我的信息</h1><p>查看当前登录账户信息，定期修改密码保障账户安全</p></div></div>
    <div class="card"><h3>账户信息</h3>
      <div class="perm-grid" style="margin-top:10px">
        <div class="perm-row"><span class="time">手机号</span><b>${u.phone}</b></div>
        <div class="perm-row"><span class="time">角色</span><b>${u.roles.join('、')}</b></div>
        <div class="perm-row"><span class="time">账户状态</span><span class="badge ${u.status?'ok':'expired'}"><i></i>${u.status?'启用':'禁用'}</span></div>
      </div>
    </div>
    <div class="card" style="margin-top:16px"><h3>修改密码</h3><p>密码由 8-16 位数字、大小写字母组成，不能包含空格；修改成功后需重新登录</p>
      <div class="field" style="max-width:360px"><label>新密码</label><input type="password" placeholder="请输入你的密码!" oninput="pwdForm.p1=this.value"></div>
      <div class="field" style="max-width:360px"><label>确认密码</label><input type="password" placeholder="请确认你的密码!" oninput="pwdForm.p2=this.value"></div>
      <button class="btn btn-primary" style="margin-top:6px" onclick="applyPwd()">确认修改</button>
    </div>
  </div>`}
  function applyPwd(){const pe=pwdError(pwdForm.p1);if(pe){toast(pe);return}
    if(!pwdForm.p2){toast('请确认你的密码!');return}
    if(pwdForm.p1!==pwdForm.p2){toast('二次密码不一致');return}
    pwdForm={p1:'',p2:''};
    toast('修改成功,请重新登录');setTimeout(()=>{curUser=0;view='hotels';activeHotel=null;render()},1200)}

  /* ===== 授权弹窗 ===== */
  function openAuth(i){authIndex=i;platform=hotels[i].douyin!=='ok'?'douyin':hotels[i].ctrip!=='ok'?'ctrip':'douyin';method='sms';reauth=false;modal()}
  function modal(){const h=hotels[authIndex];const st=v=>v==='ok'?'已授权 · 保活中':v==='expired'?'已失效 · 需重新授权':'待授权';const ok=h[platform]==='ok'&&!reauth;$('#modalRoot').innerHTML=`<div class="modal-mask" onclick="closeModal(event)"><div class="modal" onclick="event.stopPropagation()">
    <button class="close" onclick="closeModal()">×</button>
    <h2>${both(h)?'更新酒店平台授权':'授权酒店平台账号'}</h2>
    <div class="sub">${h.name} · ${h.sub}</div>
    <div class="steps">
      <button class="${platform==='douyin'?'active':''}" onclick="platform='douyin';reauth=false;modal()"><b>抖音来客</b><small>${st(h.douyin)}</small></button>
      <span>›</span>
      <button class="${platform==='ctrip'?'active':''}" onclick="platform='ctrip';method='sms';reauth=false;modal()"><b>携程官网</b><small>${st(h.ctrip)}</small></button>
    </div>
    ${ok?`<div class="success"><b>✓　${platform==='douyin'?'抖音来客':'携程官网'}授权有效</b><p>会话保活中，系统将在诊断前自动校验。</p><button class="btn btn-outline reauth" onclick="reauth=true;modal()">重新授权当前平台</button></div>`
    :`${platform==='ctrip'
        ?`<div class="methods"><button class="active">验证码登录</button></div>`
        :`<div class="methods"><button class="${method==='sms'?'active':''}" onclick="method='sms';modal()">验证码登录</button><button class="${method==='password'?'active':''}" onclick="method='password';modal()">账密登录</button></div>`}
      <label class="auth-field"><span>${method==='sms'?'手机号':'账号'}</span><input value="138 8888 6620"></label>
      ${method==='sms'?`<label class="auth-field"><span>验证码</span><div class="code"><input placeholder="请输入 6 位验证码"><button onclick="this.textContent='已发送 59s'">获取验证码</button></div></label>`:`<label class="auth-field"><span>密码</span><input type="password" placeholder="请输入密码"></label>`}
      <button class="btn btn-primary" style="width:100%;margin-top:8px" onclick="authorize()">确认授权</button>`}
    <div class="modal-foot">授权成功后将自动保活一段时间，具体时长以平台实际会话为准。</div>
  </div></div>`}
  function authorize(){hotels[authIndex][platform]='ok';reauth=false;toast(`${platform==='douyin'?'抖音来客':'携程官网'}授权成功`);modal();render()}
  function closeModal(e){if(e&&e.target!==e.currentTarget)return;$('#modalRoot').innerHTML='';authIndex=null}

  function render(){nav();const pages={hotels:hotelsPage,diag:diagPage,tasks,detail,users:usersPage,roles:rolesPage,res:resPage,profile:profilePage};$('#app').innerHTML=(pages[view]||hotelsPage)()}
  render();
</script>
</body>
</html>
